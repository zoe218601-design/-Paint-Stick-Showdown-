<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>彩弹火柴：地牢试炼</title><link rel="stylesheet" href="css/game.css">
</head>
<body>
 <canvas id="game" aria-label="3D 游戏场景"></canvas>
 <header><div><strong data-text="title"></strong><small>PAINT STICK SHOWDOWN</small></div><div class="actions"><select id="language" aria-label="语言 / Language"><option value="0">简体中文</option><option value="1">English</option><option value="2">繁體中文</option></select><button id="pause" data-text="pause"></button></div></header>
 <div id="hud"><div class="top"><span id="roomLabel"></span><b><span data-text="remaining"></span> <span id="enemies"></span></b></div><p id="objective"></p><section id="bossHud" hidden><b id="bossName"></b><div class="bar"><i id="bossFill"></i></div></section><p id="danger" hidden></p><div id="crosshair">＋</div><div class="bottom"><section><small data-text="health"></small><strong id="health"></strong><div class="bar"><i id="healthFill"></i></div><span data-text="coins"></span> <b id="coins"></b></section><section class="weapon"><small data-text="gun"></small><strong id="ammo"></strong></section></div></div>
 <div id="overlay"><section class="card"><small data-text="subtitle"></small><h1 id="heading"></h1><p id="description"></p><p id="summary"></p><button id="play"></button><p data-text="controls"></p><p data-text="fallback"></p><small data-text="debug"></small></section></div>
 <div id="eventPanel" hidden><section class="card"><h2 id="eventTitle"></h2><p id="eventCoins"></p><div id="eventItems"></div><button id="eventClose" data-text="close"></button></section></div>
 <script src="vendor/three-bundle.js"></script><script src="js/weapons.js"></script>
 <script src="js/config.js"></script><script src="js/i18n.js"></script><script src="js/room.js"></script><script src="js/player.js"></script><script src="js/monsters.js"></script><script src="js/drops.js"></script><script src="js/combat.js"></script><script src="js/ui.js"></script><script src="js/attacks.js"></script><script src="js/boss.js"></script><script src="js/levels.js"></script><script src="js/main.js"></script>
</body></html>
